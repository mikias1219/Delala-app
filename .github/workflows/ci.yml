name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delala
          POSTGRES_PASSWORD: delala_dev_password
          POSTGRES_DB: delala
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U delala -d delala"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6381:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: E2E tests
        env:
          NODE_ENV: development
          PORT: 3010
          API_HOST: 0.0.0.0
          DATABASE_HOST: localhost
          DATABASE_PORT: 5435
          DATABASE_USER: delala
          DATABASE_PASSWORD: delala_dev_password
          DATABASE_NAME: delala
          REDIS_HOST: localhost
          REDIS_PORT: 6381
          JWT_SECRET: ci-test-secret
          OTP_DEV_MODE: 'true'
        run: npm run test:e2e

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: dart format --set-exit-if-changed lib
