services:
  postgres:
    image: postgres:16-alpine
    container_name: thcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-thcp}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-thcp_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-thcp}
    ports:
      - '${DATABASE_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-thcp} -d ${DATABASE_NAME:-thcp}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thcp-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thcp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./backend/src:/app/src
    profiles:
      - full

volumes:
  postgres_data:
